name: Release

# Tag `v<version>` (the version in package.json) to release the extension:
# a GitHub release with the .vsix, then the VS Code Marketplace and Open VSX.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: The tag is the package's version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::package.json is $version, but the tag is ${{ github.ref_name }}"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Package
        run: |
          mkdir -p dist
          npx vsce package --out "dist/webfluent-vscode-$(node -p 'require("./package.json").version').vsix"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.vsix

      # Each needs its own token as a repository secret (`VSCE_PAT`,
      # `OVSX_PAT`); without one that step warns and passes. A version
      # already published is skipped.
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, so the extension was not published to the VS Code Marketplace."
          else
            npx --yes @vscode/vsce publish --packagePath dist/*.vsix --skip-duplicate
          fi

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set, so the extension was not published to Open VSX."
          else
            npx --yes ovsx publish dist/*.vsix --pat "$OVSX_PAT" --skip-duplicate
          fi
