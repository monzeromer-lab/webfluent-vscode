name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Built and packaged as the marketplace would take it. Its 0.2.0 package
  # could not start (the language client was left out of it), and nothing
  # before this built or loaded what it carried.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # With the network: the pinned WebFluent release's server is
      # downloaded, checked against SHA256SUMS and answers `initialize`, as a
      # reader's first start would.
      - run: npm test
        env:
          WF_NETWORK_TESTS: "1"
      - run: npx --no-install vsce package --out webfluent.vsix
